name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - build/windows-x86-64-v3-20261010
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Serialize attempts for the same ref and never discard a package build that may seed a cache.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test release archives
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      upload_artifacts: true

  publish:
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          case "$version" in
            ''|*[!0-9A-Za-z.-]*)
              printf 'Invalid package version: %s\n' "$version" >&2
              exit 1
              ;;
          esac
          expected_tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME}" != "$expected_tag" ]]; then
            printf 'Release tag does not match package version: expected %s\n' "$expected_tag" >&2
            exit 1
          fi
          linux_name="mom-${expected_tag}-lin.tgz"
          windows_name="mom-${expected_tag}-win.zip"
          mapfile -d '' archives < <(find artifacts -type f -print0)
          mapfile -d '' linux_files < <(find artifacts -type f -name "$linux_name" -print0)
          mapfile -d '' windows_files < <(find artifacts -type f -name "$windows_name" -print0)
          if (( ${#archives[@]} != 2 || ${#linux_files[@]} != 1 || ${#windows_files[@]} != 1 )); then
            printf 'Expected exactly one unified Linux tgz and one unified Windows zip; found:\n' >&2
            printf '  %s\n' "${archives[@]}" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            case "$(basename "$archive")" in
              "$linux_name"|"$windows_name") ;;
              *) printf 'Unexpected release archive name: %s\n' "$(basename "$archive")" >&2; exit 1 ;;
            esac
          done
          checksums=()
          for archive in "${archives[@]}"; do
            directory="$(dirname "$archive")"
            filename="$(basename "$archive")"
            checksum="$archive.sha256"
            (cd "$directory" && sha256sum "$filename" > "$filename.sha256")
            (cd "$directory" && sha256sum -c "$filename.sha256" >/dev/null)
            checksums+=("$checksum")
          done
          files=("${archives[@]}" "${checksums[@]}")
          # Give branch builds immutable source tags; retries repair the same draft release.
          tag="$expected_tag"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            tag="${expected_tag}-build-${GITHUB_SHA:0:12}"
          fi
          cat > release-notes.md <<EOF
          Automated MoM $version build.

          Source: https://github.com/$GH_REPO/commit/$GITHUB_SHA
          Workflow: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID

          Includes unified Linux and Windows x86-64 packages and SHA256 checksums.
          Windows builds from the fork build branch require an x86-64-v3 CPU.
          Donation is disabled by default on the fork build branch.
          Archives passed CPU and portable SYCL/OpenCL CPU tests. Discrete GPU hardware was not tested.
          EOF
          # Query releases first so authentication/API errors cannot look like a missing release.
          tags=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name')
          if ! printf '%s\n' "$tags" | grep -Fxq "$tag"; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "MoM $tag" --draft --notes-file release-notes.md
          fi
          gh release upload "$tag" "${files[@]}" --clobber
          gh release edit "$tag" --draft=false --latest=false --notes-file release-notes.md
